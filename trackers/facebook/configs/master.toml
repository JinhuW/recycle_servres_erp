# Recycle Servers LLC — master Facebook Marketplace monitor config.
#
# This is the single source of truth for what the fleet searches. Per-worker
# configs in configs/generated/ are produced from this file plus fleet.toml by
#     rsc gen-configs
# Never edit configs/generated/*.toml by hand.
#
# Secrets are referenced as "${ENV_VAR}" and expanded from the environment
# (see secrets.env.example).

[monitor]
# Phase 1 single-machine run: authenticate from the captured session. Sharded
# workers override this with their own /data/fb_state.json (see sharding.py),
# so setting it here only affects a direct `aimm --config master.toml` run.
storage_state_path = "configs/sessions/personal.json"
# proxy_server is injected per worker by the sharding generator; a bare Phase 1
# run uses the local IP.

# --------------------------------------------------------------------------
# AI backend — OpenRouter, reached through the OpenAI-compatible client.
# provider = "openai" selects OpenAIBackend; base_url redirects it to OpenRouter.
# --------------------------------------------------------------------------
[ai.openrouter]
provider = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
model = "openai/gpt-5.6-luna"
timeout = 60
# Without an explicit cap OpenRouter prices each request at the model's full
# 65536-token output ceiling and 402s any balance below it. The verdict is a
# few dozen tokens; 8192 leaves generous room for reasoning tokens.
max_tokens = 8192

# --------------------------------------------------------------------------
# Marketplace / account
# --------------------------------------------------------------------------
[marketplace.facebook]
# Authentication is session-based: no username or password is stored anywhere.
# Create the session once from a browser you are already logged into —
#
#   rs-session capture                       # log in by hand, save the session
#   rs-session import --cookies cookies.txt  # or convert an existing export
#
# and point storage_state_path (in [monitor], set per worker) at the result.
# Refresh it with `rs-session check --save-refreshed` before it expires.
#
# Optional password fallback, only if you want one on a given node. Leaving
# these unset is the intended setup; when set, they are used solely if the
# saved session has gone invalid.
#   username = "${FB_USERNAME}"
#   password = "${FB_PASSWORD}"
#   totp_secret = "${FB_TOTP_SECRET}"

# Window for finishing a login challenge by hand over noVNC, on the rare
# occasions Facebook interrupts a restored session.
login_wait_time = 120

# Single-machine run: the US east, centred on Virginia. Sharded workers ignore
# this and use search_region = "<their region>" instead.
#
# Every slug here was verified with scripts/check-cities.py — always do that
# before adding one, because the failures are silent and four candidates have
# already been rejected this way:
#   norfolk, hartford, newhaven  — do not resolve at all. Facebook then searches
#                                  from the account's own city and returns
#                                  plausible results from the wrong region.
#   arlington                    — resolves to Arlington, TEXAS.
#   portland                     — resolves to Portland, OREGON. Maine's coastal
#                                  cities are reached via "bangor" instead.
#
# Many centres at a tight radius rather than a few at 500 km. A wide radius
# looks like it covers everything and does not: Facebook ranks and truncates
# results, so distant listings that are geographically "in range" never appear.
# Searching from a nearby centre is the only way to see them.
search_city = [
    # Ordered by how much decommissioned server hardware the area produces.
    #
    # Tier 1 — the big datacenter markets. Note that "Data Center Alley" itself
    # (Ashburn, Reston, Manassas, Sterling) has no Marketplace slug of its own;
    # all of it sits inside dc's 100-mile circle, which is why dc is the single
    # most valuable entry here.
    "dc", "nyc", "atlanta", "philly", "columbus",
    # Tier 2 — real datacenter presence, and the corridors gear moves through.
    "richmond", "charlotte", "raleigh", "boston", "baltimore",
    "miami", "cleveland", "pittsburgh",
    # Ohio Valley. Added after a $150 Samsung PM883 + PC4-2666V ECC lot in
    # Louisville (item 955960664200505, listed 4 days) was missed entirely.
    # A search centred on louisville puts it at POSITION 1 and returns 64
    # Louisville-area listings; the same phrase from columbus returns ZERO of
    # them at radius 100, 250 OR 500, and returns zero with deliveryMethod and
    # daysSinceListed dropped as well. Cincinnati, 89 mi from the seller, also
    # returns zero. Neither radius nor the filters are the knob: results are
    # anchored to the city in the URL path, so the only way to see a metro's
    # listings is to search from that metro. Louisville is 189 mi from
    # columbus, the nearest centre this list had.
    "louisville",
    # Tier 3 — regional coverage. Lower datacenter density, but they catch
    # business and lab clear-outs the hubs miss.
    "virginiabeach", "providence", "buffalo", "rochester", "syracuse",
    "tampa", "orlando", "jacksonville", "bangor",
    # New England fill-in. These are NUMERIC LOCATION IDS, not slugs, and that
    # is not a stylistic choice: `worcester`, `hartford`, `newhaven`, `lowell`
    # and `springfield` are all rejected by Facebook, which then answers from
    # the ACCOUNT'S OWN city instead of erroring — a silently wrong search.
    # Every id below was read out of Facebook's own location picker by
    # `scripts/find-city-id.py` and is paired with its label in city_name.
    #
    # Chosen for geography Boston's circle does not already reach: inland MA,
    # all of Connecticut (previously uncovered — Hartford and New Haven are
    # insurance/finance datacenter country), and southern NH. Cambridge, Lowell
    # and Nashua were resolved too but deliberately LEFT OUT: they sit inside
    # Boston's 100 mi and would mostly re-search the same listings.
    "105596609473837", "112781448736001", "108119482550253",
    "108541499165950", "107634079257154",
]
city_name = [
    "Washington, DC", "New York, NY", "Atlanta, GA", "Philadelphia, PA", "Columbus, OH",
    "Richmond, VA", "Charlotte, NC", "Raleigh, NC", "Boston, MA", "Baltimore, MD",
    "Miami, FL", "Cleveland, OH", "Pittsburgh, PA", "Louisville, KY",
    "Virginia Beach, VA", "Providence, RI", "Buffalo, NY", "Rochester, NY", "Syracuse, NY",
    "Tampa, FL", "Orlando, FL", "Jacksonville, FL", "Bangor, ME",
    "Worcester, MA", "Springfield, MA", "Hartford, CT",
    "New Haven, CT", "Manchester, NH",
]
# Two things about radius, both measured 2026-08-20, both surprising.
#
# FIRST, THE UNIT IS KILOMETRES. Read back off Facebook's own distance label:
#
#   radius=60 -> "Within 37 mi"    radius=161 -> "Within 100 mi"
#   radius=100 -> "Within 62 mi"   radius=500 -> "Within 311 mi"
#   radius=805 -> "Within 500 mi"  radius=1000 -> "Within 621 mi"
#
# So the numbers below are 62 mi and 37 mi, and 500 elsewhere in this file is
# 311 mi — not the maximum either, 805 and 1000 are both accepted. Every
# coverage claim written before this was in the wrong unit.
#
# SECOND, AND IT MAKES THE FIRST MOSTLY MOOT: THE VALUE CHANGES NOTHING. Same
# city, same phrase, same filters, four radii spanning 37 to 311 miles:
#
#   server_ram from dc, radius 60 / 100 / 161 / 500
#       -> 120 results, 103 opened, 15 candidates. IDENTICAL at all four.
#   enterprise_ssd from jacksonville, radius 100 vs 161
#       -> 114 results, 34 opened, 1 candidate. Identical.
#
# Facebook returns what it wants to return and the radius does not move it.
# Coverage therefore comes from the NUMBER OF CITY CENTRES, not from the
# circles around them, which is what the list below already does — so this is
# left as-is rather than "fixed" into a unit that buys nothing. Re-measure with
# scripts/probe-search-url.py before drawing any conclusion from a radius.
#
# 100 km per centre: wide enough that neighbouring metros join up, tight enough
# that Facebook actually returns what is in range.
#
# The New England five get 60 km (37 mi). They are packed close together —
# Hartford to New Haven is 40 mi — so a 100 mi circle on each would mostly re-search its
# neighbours rather than add anything, and every duplicate search costs a full
# sweep slot.
radius = [
    100, 100, 100, 100, 100,
    100, 100, 100, 100, 100,
    100, 100, 100, 100,
    100, 100, 100, 100, 100,
    100, 100, 100, 100,
    60, 60, 60,
    60, 60,
]
currency = "USD"

# NO category filter. `category = "electronics"` was tried and MEASURED to be a
# no-op: the same search with and without it returned the identical 42 results
# in the identical order, pickup truck included. Facebook ignores the category
# parameter once the URL carries a query. Leaving it set would imply a filter
# that is not actually running, so it is deliberately absent.
#
# NO sort_by — Facebook's default relevance ranking. This was measured, and it
# is the single largest quality lever found so far.
#
# Newest-first sounds right for a new-listing tracker and is actively harmful
# here. Facebook fuzzy-matches, so a query has thousands of loose hits;
# sortBy=creation_time_descend returns the newest of THOSE, which is mostly
# junk, while relevance returns the best matches. Measured over 6 city/phrase
# pairs, same filters, same scrolling:
#
#   sort=new     12 on-target out of 247 results   ( 5%)
#   relevance    56 on-target out of 212 results   (26%)
#
# Every single pair was better on relevance. Freshness is not lost: the 7-day
# window plus a sweep every few hours plus the dedupe cache means a new listing
# is still seen, it just is not forced to the top.
#
# `exact=false` was tested at the same time and is a no-op — identical results.

# Local pickup only. We buy hardware to collect in person, and shipping-only
# listings are also the strongest single signal of the eBay-reseller cross-posts
# the prompt already tries to reject — a storefront ships, a garage clear-out
# does not. Filtering at the URL means those never occupy a result slot.
delivery_method = "local_pick_up"

# Facebook offers exactly three windows: 1, 7 and 30 days.
#
# A week rather than a day. The dedup cache means the wider window costs one
# catch-up pass, not repeated alerts — anything already seen is skipped before
# the AI is asked, so the extra listings are only paid for once. It also makes
# the sweep robust to its own length: with a full cycle taking hours, a 24-hour
# window left no margin if a pass ran long or the worker restarted mid-sweep.
#
# The two values are [first scan, later scans].
date_listed = ["last 7 days", "last 7 days"]

# Reject on the title before opening the listing.
#
# The URL this fleet builds is character-for-character the one you get by
# typing the query into Marketplace by hand — query, daysSinceListed=7,
# deliveryMethod=local_pick_up, radius. What differs is how much of the result
# list is consumed. A person reads the first screen; the monitor reads the
# whole ranked list, and Facebook's matching is fuzzy enough that past roughly
# the 36th result it stops matching the query at all and pads with whatever
# else is local. Measured on 2026-08-20, "samsung micron sk hynix ram" from dc
# at radius 100: 115 results, 32 of which contained no word of the query
# (a Vizio TV, a Garmin watch, an Eotech sight).
#
# Reading that far is still right — a 64 GB ECC SKhynix server lot sat at
# position 66, well past where a human stops scrolling — but each of those
# listings used to cost a full detail-page visit before the keyword gate could
# reject it. Over one 18.7 h window: 205 of 326 fetched pages were killed by
# the gate seconds after loading, and 155 carried no gate word in their title.
# At ~13 s a visit that is about 45 minutes of every cycle spent opening
# harmonicas and Miatas.
#
# The gate words here (ram, memory, dimm, ddr*, xeon, epyc, ssd) are category
# words that any genuine listing puts in its title, so the title is enough to
# reject on. Titles under 4 words are exempt and still fetched, because a terse
# title ("DDR 3 lot", "Apple Server") means the spec is in the description.
#
# Cost, measured on the same window: 20 of 258 AI evaluations came from
# listings whose title lacked the gate word. Every one was rated below
# threshold — no alert was lost.
title_prefilter = true

# Stop reading each result list at 120.
#
# Marketplace answers the query for roughly the first 60 results, then pads the
# grid with whatever else is local. Measured 2026-08-20 from dc, radius 100,
# two phrases of ~213 results each — share of results still matching any word
# of the query:
#
#   position   1-60    ~93%
#   position  61-120   ~64%
#   position 121-213   ~36%
#
# The tail is not empty, it is expensive. Counting listings worth opening a
# page for (a lot, or a server/enterprise part) against the pages opened to
# find them:
#
#   first 100 results    146 pages opened, 27 candidates   ~5 pages each
#   beyond position 100  106 pages opened,  4 candidates  ~26 pages each
#
# 120 rather than 100: neither phrase turned up anything between the two, so it
# is a free margin over the measured cliff. Raise it if a probe report starts
# showing candidates near the limit — reports/search-probe-<date>.md prints the
# position of every hit, and the log says "stopped at the max_results limit"
# whenever a search ends here rather than running out.
max_results = 120

# Skip sellers Facebook itself rates below 4.5.
#
# Marketplace rates a seller out of 5 from their completed sales, and the
# rating is embedded in every listing page, so this costs nothing extra to
# read and lands before the AI call. Anything under 4.5 is a seller other
# buyers have complained about — for a business driving to a stranger's
# address with cash, that is not a listing worth the trip.
min_seller_rating = 4.5

# Sellers Facebook shows NO rating for still get through.
#
# On Marketplace an unrated seller is the ordinary case, not a warning: most
# private sellers clearing out a garage have never completed a tracked sale, so
# demanding a rating would throw away most of what this fleet is here to find.
# Set this to true only to deliberately buy from rated sellers only.
exclude_unrated_sellers = false

# Conservative pacing: each item is searched every 45-75 min, randomized.
search_interval = "45m"
max_search_interval = "75m"

# Only surface listings the AI rates 4+ ("good match" / "great deal").
rating = 4
# Never alert on a lot the AI counts at fewer than 5 units, whatever the
# score — the code-level twin of the prompt's 5-unit minimum. An uncounted
# listing (unit_count null) is never suppressed on doubt.
min_unit_count = 5
ai = ["openrouter"]
notify = ["recycle"]

# AI evaluation prompt — Recycle Servers is now buying only three component
# types, and only in bulk (5+ of the same part). Whole servers, drives that are
# not SSDs, networking gear, and single units are all rejected. Adapted from the
# Reddit tracker's system prompt; the rating_prompt maps the buy/don't-buy
# decision onto aimm's required 1-5 scale (target -> 4-5, reject -> 1-2).
prompt = """You are a purchasing agent for Recycle Servers LLC, a used-server hardware reseller in Denver, CO.

Decide whether this Facebook Marketplace listing is a FOR-SALE listing of ONE of the component types we are buying, offered as a BULK LOT:

- RAM: DDR4 or DDR5 memory modules ONLY — server ECC RDIMM/LRDIMM, desktop
  DIMMs, and laptop SODIMMs are ALL wanted in all three form factors. We do
  NOT buy DDR3, DDR2 or older generations any more. Module label prefixes
  identify the generation when the seller doesn't say: PC4-xxxxx is DDR4,
  PC5-xxxxx is DDR5 (wanted); PC3/PC3L is DDR3 and PC2 is DDR2 (rejected).
- SSD: enterprise/datacenter solid-state drives (SATA, SAS, or NVMe/U.2).

The listing must include AT LEAST 5 units of that component (5+ DDR4/DDR5 RAM modules or 5+ SSDs).

We are NOT buying CPUs at the moment. Reject Xeon and EPYC processors even though they are server parts.

You are judging TEXT ONLY — the title and the description. The photos are not
attached, so never assume what they show. Read the whole description before
deciding the quantity: sellers often bury the count in a sentence rather than
the title ("clearing out a box of 24", "$8 each, 40 available", "12 sticks
total", "3 trays of 8"). Work the count out from whatever the text gives —
an explicit number, a per-unit price with an available count, or a lot
described as N x M — and only treat the quantity as unstated when the text
really gives nothing to count.

When the text makes you CONFIDENT the seller is offering exactly ONE unit,
reject the listing. Singular phrasing all the way through is the signal:
"selling my 32GB stick", "1x 960GB SSD", "this drive", "the module", one
price for one item, a title naming a single part number with no count. This
rule outranks everything else about the listing — a lone module or drive is
rejected however large its capacity, however low its price, however rare the
part. We are buying lots; one unit is not a lot, and it is not worth the
drive. Only genuine doubt about the count sends you to the quantity-unclear
rule instead — do not manufacture doubt to rescue an attractive single item.

Reject the listing when ANY of these is true:
- It is not RAM or an SSD as defined above. Reject whole servers, CPUs, motherboards, GPUs, hard disk drives (HDD), networking gear (NICs, switches), and other parts.
- The memory is DDR3, DDR2 or older ONLY. A mixed-generation lot qualifies on its DDR4/DDR5 modules alone: count only those toward the 5-unit minimum and reject if fewer than 5 remain.
- The seller is clearly offering ONE unit (see the single-unit rule above).
- It has fewer than 5 units of the component, or the text gives nothing to work a quantity out from.
- The SSDs are low-capacity consumer drives with no resale value to us. This
  exclusion does NOT apply to RAM: desktop and laptop memory are wanted, so
  never reject a memory lot merely for being non-ECC, SODIMM, or "gaming".
- The seller is looking to buy or trade, or it is a discussion rather than a real for-sale listing.
- The listing is already marked sold or pending.
- It is an eBay (or other online marketplace) reseller cross-posting their storefront inventory rather than a local seller with the parts in hand. Tell-tales: pointing at their eBay store or feedback score, stock/catalogue photos instead of photos of the actual parts, "brand new sealed" retail stock, shipping-only with no local pickup, or a description written as a retail spec sheet.
  Do NOT reject a genuine local seller merely for mentioning eBay — quoting eBay prices to justify their own ("these go for $1k on eBay") is normal and is not a reason to reject."""

rating_prompt = """Rate this listing from 1 to 5:
1 - Reject: not RAM/SSD, DDR3-or-older memory only, fewer than 5 units, a consumer SSD, an eBay/marketplace reseller cross-post, or already sold/pending (see the reject rules above). A listing you are confident is a SINGLE unit is always a 1 — never rate it higher on capacity, price or condition.
2 - Unlikely: probably not a qualifying bulk component lot, or the text establishes no quantity.
3 - Maybe: a qualifying component type but borderline quantity (around 5), unclear condition, or a memory lot whose generation cannot be determined from the text.
4 - Good: a clear bulk lot of 5+ DDR4/DDR5 memory modules (server, desktop or laptop) or 5+ enterprise SSDs, with usable details.
5 - Strong: a large or high-value bulk lot (many units, high capacity, or priced well below market). "Large" and "high-value" describe the lot, never a single unit.
Conclude with exactly one JSON object and nothing else — no prose before or after it, no code fences:
{"rating": <1-5>, "unit_count": <integer or null>, "count_phrase": "<phrase>", "summary": "<summary>"}
where:
- rating is the 1-5 rating defined above;
- unit_count is the number of units you worked out from the text. Use 1 ONLY when you are confident the seller is offering exactly one unit (the single-unit rule above); use null when the text gives nothing to count or you are genuinely unsure. A confident unit_count of 1 must always come with a rating of 1.
- count_phrase is that count as a short phrase (e.g. "8 sticks", "24 SSDs"), or "" when unit_count is null;
- summary names the component type, the unit count, and the price (max 25 words). Always state the count explicitly, e.g. "8x 32GB DDR4 ECC RDIMM"."""

# --------------------------------------------------------------------------
# Regions — each worker VM is pinned to exactly one of these.
#
# THE CITY LIST IS THE COVERAGE. A metro is invisible until it has its own
# search_city entry; the radius around a neighbouring centre does not reach it.
# This is measured, not assumed — see the radius block above, and the Louisville
# case in the search_city comment: a listing at POSITION 1 from `louisville`
# returned ZERO from `columbus` (189 mi away) at radius 100, 250 AND 500, with
# the filters dropped as well. Results are anchored to the city in the URL path.
#
# So these lists are the union of every centre worth searching, split across six
# workers by geography — NOT four-city summaries with wide circles, which is
# what they used to be. Every slug in [marketplace.facebook].search_city above
# appears in exactly one region below, and `rsc gen-configs` refuses to write
# any config if that stops being true (--allow-gaps overrides it for a
# deliberate phased rollout). It has to be enforced there because the failure is
# otherwise completely silent: the fleet just never sees those metros.
#
# The split is geographic, not balanced, and it has to stay that way: fleet.toml
# pairs each region with a proxy in that part of the country, because a
# Marketplace search from a city 2000 miles from the account's IP is exactly the
# pattern Facebook checkpoints on. The east coast therefore carries far more
# centres than the mountain west, which is where the decommissioned hardware
# actually is. Pace the heavy workers with fleet.toml's per-worker
# search_interval rather than by deleting cities from them.
#
# Radius is in KILOMETRES and, as measured, changes nothing (37 mi and 311 mi
# returned identical results). 100 km matches the phase-1 list above; the New
# England five get 60 km only because they are packed close enough that wider
# circles would re-search each other.
#
# search_city values are Facebook Marketplace location slugs — the segment after
# /marketplace/ in a search URL. A wrong slug fails SILENTLY: Facebook falls
# back to the account's own location and returns plausible results from the
# wrong part of the country rather than erroring. Re-verify with
# `python scripts/check-cities.py` after editing this section. Three entries are
# not the obvious spelling:
#   - Sacramento is "sac"; "sacramento" is not a location.
#   - Billings has no slug at all, so its numeric location id is used.
#   - The five New England ids are numeric for the same reason — `worcester`,
#     `hartford`, `newhaven`, `lowell` and `springfield` are all rejected.
# Numeric ids are equally valid wherever a slug is (see upstream config.toml).
# --------------------------------------------------------------------------
[region.rs_northeast]
full_name = "Northeast"
# The heaviest region by a wide margin, and deliberately so: New England is
# dense with small centres Boston's circle does not reach, and the corridor from
# NY to Boston produces more clear-outs than anywhere except DC. ne-1 carries a
# longer search_interval in fleet.toml to keep its request rate in line.
search_city = [
    "boston", "nyc", "philly", "pittsburgh",
    "providence", "buffalo", "rochester", "syracuse", "bangor",
    # Numeric ids: Worcester MA, Springfield MA, Hartford CT, New Haven CT,
    # Manchester NH. Paired with their labels in city_name, in this order.
    "105596609473837", "112781448736001", "108119482550253",
    "108541499165950", "107634079257154",
]
city_name = [
    "Boston, MA", "New York, NY", "Philadelphia, PA", "Pittsburgh, PA",
    "Providence, RI", "Buffalo, NY", "Rochester, NY", "Syracuse, NY", "Bangor, ME",
    "Worcester, MA", "Springfield, MA", "Hartford, CT",
    "New Haven, CT", "Manchester, NH",
]
radius = [
    100, 100, 100, 100,
    100, 100, 100, 100, 100,
    60, 60, 60, 60, 60,
]
currency = "USD"

[region.rs_southeast]
full_name = "Southeast / Mid-Atlantic"
# dc is the single most valuable centre in the fleet: "Data Center Alley"
# (Ashburn, Reston, Manassas, Sterling) has no Marketplace slug of its own and
# all of it sits inside dc's circle.
search_city = [
    "dc", "baltimore", "richmond", "virginiabeach",
    "charlotte", "raleigh", "atlanta",
    "jacksonville", "tampa", "orlando", "miami",
]
city_name = [
    "Washington, DC", "Baltimore, MD", "Richmond, VA", "Virginia Beach, VA",
    "Charlotte, NC", "Raleigh, NC", "Atlanta, GA",
    "Jacksonville, FL", "Tampa, FL", "Orlando, FL", "Miami, FL",
]
radius = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100]
currency = "USD"

[region.rs_midwest]
full_name = "Midwest / Ohio Valley"
# louisville is here because of item 955960664200505 — a $150 Samsung PM883 +
# PC4-2666V ECC lot that sat listed for four days and was never seen, because
# the nearest centre the fleet had was columbus. It is the case that established
# the rule at the top of this section.
search_city = [
    "columbus", "cleveland", "louisville",
    "detroit", "chicago", "minneapolis", "stlouis",
]
city_name = [
    "Columbus, OH", "Cleveland, OH", "Louisville, KY",
    "Detroit, MI", "Chicago, IL", "Minneapolis, MN", "St. Louis, MO",
]
radius = [100, 100, 100, 100, 100, 100, 100]
currency = "USD"

[region.rs_south_central]
full_name = "South Central"
search_city = ["memphis", "dallas", "houston", "neworleans"]
city_name = ["Memphis, TN", "Dallas, TX", "Houston, TX", "New Orleans, LA"]
radius = [100, 100, 100, 100]
currency = "USD"

[region.rs_mountain]
full_name = "Mountain / Plains"
# 112454482100538 = Billings, MT. It is the only one of these with no slug; it
# anchors the northern plains, which nothing else reaches.
search_city = ["denver", "112454482100538", "saltlakecity", "albuquerque"]
city_name = ["Denver, CO", "Billings, MT", "Salt Lake City, UT", "Albuquerque, NM"]
radius = [100, 100, 100, 100]
currency = "USD"

[region.rs_west]
full_name = "West Coast"
search_city = ["seattle", "portland", "sac", "la", "phoenix"]
city_name = ["Seattle, WA", "Portland, OR", "Sacramento, CA", "Los Angeles, CA", "Phoenix, AZ"]
radius = [100, 100, 100, 100, 100]
currency = "USD"

# --------------------------------------------------------------------------
# Buying criteria — three component types only, bulk lots of 5+. The item
# NAME (server_ram / server_cpu / enterprise_ssd) also drives the alert's
# category tag (RAM / CPU / SSD), so keep those keywords in the names.
# --------------------------------------------------------------------------
[item.server_ram]
search_phrases = [
    # ONE phrase carries the whole RAM sweep, so it is the most-measured line
    # in this file. Every word here is one Facebook actually indexes.
    #
    # Measured across three cities, same filters, counting parts listings in
    # the returned results:
    #
    #   server ram memory ddr4 ddr5 ecc   dc 28/42   nyc 28/42   boston 21/42
    #   samsung micron sk hynix ram       dc  9/22   nyc  6/24   boston  0/0
    #   server ram (bare)                 dc  5/43
    #
    # Two rules learned the hard way, both worth keeping:
    #
    # 1. NEVER add "rdimm", "lrdimm", "udimm", "nvme", "sas" or "u.2" here.
    #    Facebook has no index for them, and ONE such word drags the entire
    #    query to zero results. They belong in `keywords` below, which runs
    #    locally on text already fetched and can afford precise terms.
    #
    # 2. A single zero-result reading is NOT proof a phrase is dead — the same
    #    query returned 0 in one city and 28 in the same city minutes later.
    #    Only a zero in every city (as "samsung micron sk hynix ssd" gave)
    #    means the query is genuinely unindexed.
    "server ram memory ddr4 ddr5 ecc",
]
# "server memory" was dropped here (1 on-target / 0 noise). It overlapped
# almost entirely with "server ram", and at ~160 s per search x 22 cities
# each phrase costs about an hour of cycle time. A shorter cycle is worth
# more than a redundant phrase: this is a NEW-listing tracker, so the time
# between visits to a city is the window in which a listing goes unseen.
# Category gate, not a precision filter. It runs against the TITLE ALONE
# (before the description is fetched), so anything narrower silently drops
# listings whose title omits the spec — "8x 16GB DDR4 Server Memory" contains
# no "ECC". Precision is the AI's job; this only has to exclude things that
# are plainly not memory.
# "sodimm", "rdimm" and "lrdimm" are listed SEPARATELY and not left to "dimm".
# Matching starts at a word boundary (so "ram" cannot match "ceramic"), which
# also means "dimm" does NOT match "sodimm" — the word starts with "so". Each
# spelling therefore has to appear in its own right, or laptop memory silently
# stops passing the gate.
# "ddr3" STAYS in the gate even though DDR3-only lots are now rejected — by the
# AI, which sees the whole listing. Removing it here would silently drop mixed
# lots titled "DDR3/4 lot" (no standalone "ddr4" for the gate to match), and
# the measured cost of letting DDR3 titles through to the AI is a handful of
# cheap evaluations per cycle, not lost alerts.
keywords = ["ram OR memory OR dimm OR sodimm OR rdimm OR lrdimm OR udimm OR ddr3 OR ddr4 OR ddr5 OR ecc"]
# "desktop", "sodimm", "laptop", "gaming" and "rgb" were REMOVED: we recycle
# desktop DIMMs and laptop SODIMMs too, and each of those words was throwing
# away exactly the listings we now want. What is left excludes non-lots and
# storefront cross-posts, which is all an antikeyword should be doing — the
# rest is the AI's call.
antikeywords = ["single stick", '"ebay store" OR "my ebay" OR "ebay listing" OR "ebay.com" OR "our ebay" OR "ebay feedback"']
# No price bounds: a bulk lot is often listed at a price the seller made up,
# and a minPrice/maxPrice filter drops those listings before they can be
# judged. Scoring is the AI's job, so let it see everything.
description = """Bulk lots of DDR4/DDR5 memory in any form factor — server
ECC RDIMM/LRDIMM, desktop DIMMs, and laptop SODIMMs. Lots of 5+ modules.
DDR3 and older generations are not wanted."""

[item.server_cpu]
# Paused. Everything below is preserved — flip this to true to resume.
enabled = false
search_phrases = [
    # "xeon scalable" and "xeon gold" were dropped: both are Xeons, so
    # "xeon lot" already covers them.
    "xeon lot",
    "epyc lot",
    "server cpu lot",
]
keywords = ["xeon OR epyc"]
antikeywords = ["laptop", "i3", "i5", "i7", "i9", "ryzen", "single", '"ebay store" OR "my ebay" OR "ebay listing" OR "ebay.com" OR "our ebay" OR "ebay feedback"']
# No price bounds: a bulk lot is often listed at a price the seller made up,
# and a minPrice/maxPrice filter drops those listings before they can be
# judged. Scoring is the AI's job, so let it see everything.
description = """Bulk lots of server CPUs: Intel Xeon (E5, Scalable/Gold/Platinum)
and AMD EPYC. Only interested in lots of 5+ processors."""

[item.enterprise_ssd]
search_phrases = [
    # One phrase for the whole SSD sweep. Measured the same way:
    #
    #   ssd lot server ssd samsung micron       dc 20/42  nyc 13/42  boston 13/24
    #   server ssd solid state samsung ...      dc  7/42
    #   server ssd (bare)                       dc  2/42
    #   samsung micron sk hynix ssd             0 in ALL THREE cities — dead
    #   ssd samsung micron enterprise lot       0 results
    #
    # The last two are why the brand trick that works for RAM cannot simply be
    # copied for SSDs: the same brand words paired with "ssd" return nothing.
    "ssd lot server ssd samsung micron",
]
# Same reasoning as RAM: title-only, so keep it to "is this a drive at all".
# NOTE the quotes around "solid state": a bare multi-word term makes the
# OR-expression parser fail, and a failed parse is matched as one literal
# string — which silently rejects everything. Quote any term with a space.
keywords = ['ssd OR nvme OR u.2 OR sas OR m.2 OR "solid state"']
antikeywords = ["hdd", "hard drive", "external", "usb", "laptop", "single",
    "gaming", "rgb", "portable", "flash drive", "sd card", "thumb drive", '"ebay store" OR "my ebay" OR "ebay listing" OR "ebay.com" OR "our ebay" OR "ebay feedback"']
# No price bounds: a bulk lot is often listed at a price the seller made up,
# and a minPrice/maxPrice filter drops those listings before they can be
# judged. Scoring is the AI's job, so let it see everything.
description = """Bulk lots of enterprise/datacenter SSDs: SATA, SAS, or NVMe/U.2
solid-state drives. Only interested in lots of 5+ drives. Not spinning HDDs."""

