, and other parts. CPUs too — we are NOT buying Xeon or EPYC processors at the moment, even though they are server parts.\n- The memory is DDR3, DDR2 or older ONLY. A mixed-generation lot qualifies on its DDR4/DDR5 modules alone: count only those toward the 5-unit minimum and reject if fewer than 5 remain.\n- You are confident it is ONE unit (the single-unit rule above), it has fewer than 5 units, or the text gives nothing to work a quantity out from.\n- The memory is a consumer gaming-brand kit: Corsair (Vengeance, Dominator), G.Skill (Trident, Ripjaws, Aegis), Kingston Fury / HyperX, TeamGroup T-Force, Crucial Ballistix, ADATA XPG, or any RGB-branded kit. The brand line, not the form factor, is what rejects: plain/OEM modules (Samsung, SK Hynix, Micron, plain Crucial or Kingston ValueRAM) still qualify, and a memory lot is never rejected merely for being non-ECC, desktop, or SODIMM.\n- The SSDs are low-capacity consumer drives with no resale value to us. (This applies to SSDs only, never to RAM.)\n- The seller is looking to buy or trade, it is a discussion rather than a real for-sale listing, or it is already marked sold or pending.\n- It is an eBay (or other online marketplace) reseller cross-posting their storefront inventory rather than a local seller with the parts in hand. Tell-tales: pointing at their eBay store or feedback score, stock/catalogue photos instead of photos of the actual parts, \"brand new sealed\" retail stock, shipping-only with no local pickup, or a description written as a retail spec sheet. Do NOT reject a genuine local seller merely for mentioning eBay — quoting eBay prices to justify their own (\"these go for $1k on eBay\") is normal."
rating_prompt = "Rate the listing from 1 to 5:\n1 - Reject: any reject rule above applies. A listing you are confident is a SINGLE unit is always a 1 — never higher on capacity, price or condition.\n2 - Unlikely: probably not a qualifying bulk component lot, or the text establishes no quantity.\n3 - Maybe: a qualifying component type but borderline quantity (around 5), unclear condition, or a memory lot whose generation cannot be determined from the text.\n4 - Good: a clear bulk lot of 5+ DDR4/DDR5 memory modules (server, desktop or laptop) or 5+ enterprise SSDs, with usable details.\n5 - Strong: a large or high-value bulk lot (many units, high capacity, or priced well below market). \"Large\" and \"high-value\" describe the lot, never a single unit.\nConclude with exactly one JSON object and nothing else — no prose before or after it, no code fences:\n{\"rating\": <1-5>, \"unit_count\": <integer or null>, \"count_phrase\": \"<phrase>\", \"summary\": \"<summary>\"}\nwhere:\n- rating is the 1-5 rating defined above;\n- unit_count is the number of units you worked out from the text. Use 1 ONLY when you are confident the seller is offering exactly one unit; use null when the text gives nothing to count or you are genuinely unsure. A confident unit_count of 1 must always come with a rating of 1.\n- count_phrase is that count as a short phrase (e.g. \"8 sticks\", \"24 SSDs\"), or \"\" when unit_count is null;\n- summary names the component type, the unit count, and the price (max 25 words). Always state the count explicitly, e.g. \"8x 32GB DDR4 ECC RDIMM\"."
