# Buying criteria — two component types only, bulk lots of 5+. The item
# NAME (server_ram / enterprise_ssd) also drives the alert's category tag
# (RAM / SSD), so keep those keywords in the names. A server_cpu item (Xeon /
# EPYC lots) used to sit between them; it was paused for weeks and then removed
# on 2026-09-05 — CPUs are still rejected by the AI prompt above.
# --------------------------------------------------------------------------
[item.server_ram]
search_phrases = [
    # ONE phrase carries the whole RAM sweep, so it is the most-measured line
    # in this file. Every word here is one Facebook actually indexes.
    #
    # Measured across three cities, same filters, counting parts listings in
    # the returned results:
    #
    #   server ram memory ddr4 ddr5 ecc   dc 28/42   nyc 28/42   boston 21/42
    #   samsung micron sk hynix ram       dc  9/22   nyc  6/24   boston  0/0
    #   server ram (bare)                 dc  5/43
    #
    # Two rules learned the hard way, both worth keeping:
    #
    # 1. NEVER add "rdimm", "lrdimm", "udimm", "nvme", "sas" or "u.2" here.
    #    Facebook has no index for them, and ONE such word drags the entire
    #    query to zero results. They belong in `keywords` below, which runs
    #    locally on text already fetched and can afford precise terms.
    #
    # 2. A single zero-result reading is NOT proof a phrase is dead — the same
    #    query returned 0 in one city and 28 in the same city minutes later.
    #    Only a zero in every city (as "samsung micron sk hynix ssd" gave)
    #    means the query is genuinely unindexed.
    "server ram memory ddr4 ddr5 ecc",
]
# "server memory" was dropped here (1 on-target / 0 noise). It overlapped
# almost entirely with "server ram", and at ~160 s per search x 22 cities
# each phrase costs about an hour of cycle time. A shorter cycle is worth
# more than a redundant phrase: this is a NEW-listing tracker, so the time
# between visits to a city is the window in which a listing goes unseen.
# Category gate, not a precision filter. It runs against the TITLE ALONE
# (before the description is fetched), so anything narrower silently drops
# listings whose title omits the spec — "8x 16GB DDR4 Server Memory" contains
# no "ECC". Precision is the AI's job; this only has to exclude things that
# are plainly not memory.
# "sodimm", "rdimm" and "lrdimm" are listed SEPARATELY and not left to "dimm".
# Matching starts at a word boundary (so "ram" cannot match "ceramic"), which
# also means "dimm" does NOT match "sodimm" — the word starts with "so". Each
# spelling therefore has to appear in its own right, or laptop memory silently
# stops passing the gate.
# "ddr3" STAYS in the gate even though DDR3-only lots are now rejected — by the
# AI, which sees the whole listing. Removing it here would silently drop mixed
# lots titled "DDR3/4 lot" (no standalone "ddr4" for the gate to match), and
# the measured cost of letting DDR3 titles through to the AI is a handful of
# cheap evaluations per cycle, not lost alerts.
keywords = ["ram OR memory OR dimm OR sodimm OR rdimm OR lrdimm OR udimm OR ddr3 OR ddr4 OR ddr5 OR ecc"]
# "desktop", "sodimm" and "laptop" stay out of this list: we recycle plain
# desktop DIMMs and laptop SODIMMs, and each of those words was throwing away
# exactly the listings we want. Consumer GAMING-BRAND kits are different —
# they are not bought (owner call, 2026-08-22), and killing them here saves
# the detail-page fetch and the AI call that the prompt-level reject would
# still cost. The brand words below are whole-word matches, so plain Kingston
# ValueRAM or Crucial server memory is untouched; "fury"/"trident"/"xpg"
# etc. only ever name the gaming lines.
antikeywords = ["single stick", '"ebay store" OR "my ebay" OR "ebay listing" OR "ebay.com" OR "our ebay" OR "ebay feedback"', "corsair OR vengeance OR dominator OR g.skill OR gskill OR trident OR ripjaws OR aegis OR t-force OR tforce OR teamgroup OR xpg OR ballistix OR hyperx OR fury OR rgb"]
# No price bounds: a bulk lot is often listed at a price the seller made up,
# and a minPrice/maxPrice filter drops those listings before they can be
# judged. Scoring is the AI's job, so let it see everything.
description = """Bulk lots of DDR4/DDR5 memory in any form factor — server
ECC RDIMM/LRDIMM, desktop DIMMs, and laptop SODIMMs. Lots of 5+ modules.
DDR3 and older generations are not wanted."""

[item.enterprise_ssd]
search_phrases = [
    # One phrase for the whole SSD sweep. Measured the same way:
    #
    #   ssd lot server ssd samsung micron       dc 20/42  nyc 13/42  boston 13/24
    #   server ssd solid state samsung ...      dc  7/42
    #   server ssd (bare)                       dc  2/42
    #   samsung micron sk hynix ssd             0 in ALL THREE cities — dead
    #   ssd samsung micron enterprise lot       0 results
    #
    # The last two are why the brand trick that works for RAM cannot simply be
    # copied for SSDs: the same brand words paired with "ssd" return nothing.
    "ssd lot server ssd samsung micron",
]
# Same reasoning as RAM: title-only, so keep it to "is this a drive at all".
# NOTE the quotes around "solid state": a bare multi-word term makes the
# OR-expression parser fail, and a failed parse is matched as one literal
# string — which silently rejects everything. Quote any term with a space.
keywords = ['ssd OR nvme OR u.2 OR sas OR m.2 OR "solid state"']
antikeywords = ["hdd", "hard drive", "external", "usb", "laptop", "single",
    "gaming", "rgb", "portable", "flash drive", "sd card", "thumb drive", '"ebay store" OR "my ebay" OR "ebay listing" OR "ebay.com" OR "our ebay" OR "ebay feedback"']
# No price bounds: a bulk lot is often listed at a price the seller made up,
# and a minPrice/maxPrice filter drops those listings before they can be
# judged. Scoring is the AI's job, so let it see everything.
description = """Bulk lots of enterprise/datacenter SSDs: SATA, SAS, or NVMe/U.2
solid-state drives. Only interested in lots of 5+ drives. Not spinning HDDs."""

# --------------------------------------------------------------------------
# Notification recipient
# --------------------------------------------------------------------------
[user.recycle]
telegram_token = "${TELEGRAM_TOKEN}"
telegram_chat_id = "${TELEGRAM_CHAT_ID}"
# Forum-topic routing by the AI's counted units: 50+ -> high, 10-49 -> medium,
# 5-9 -> low. Each id is a topic's message_thread_id in the (topics-enabled)
# group above; scripts/setup-telegram-topics.py creates the topics and prints
# these. Unset ids and uncounted listings fall back to the General topic.
telegram_topic_high = "${TELEGRAM_TOPIC_HIGH}"
telegram_topic_medium = "${TELEGRAM_TOPIC_MEDIUM}"
telegram_topic_low = "${TELEGRAM_TOPIC_LOW}"
# Report each delivered alert's Telegram message_id to the coordinator so
# partner emoji reactions can be joined back to the listing (hit-rate stats).
# Fail-open telemetry: an unset env var leaves the literal ${...} in place,
# which the validator treats as "reporting off" — alerts are never affected.
alert_report_url = "${RS_ALERT_REPORT_URL}"
alert_report_token = "${RS_COORDINATOR_TOKEN}"
alert_report_worker_id = "homelab-monitor"
# Do not re-notify about the same listing.
remind = false
