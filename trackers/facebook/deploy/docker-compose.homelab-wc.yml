# wc-1, a second West worker on the Decodo exit in Leesburg, VA
# (PROXY_HOMELAB_WC, port 10009). That port was va-1's until va-1's account
# was locked on 2026-10-18. va-1 is retired, so no other account uses this IP.
#
# It searches the same rs_west cities as west-1 (configs/homelab-wc.toml, made
# by `deploy/make-region-config.py rs_west PROXY_HOMELAB_WC`). The coordinator
# dedupes, so a second account adds redundancy, not duplicate alerts. Its
# account (from the ERP's pool) is already in its vault slot, so it signs in
# on first start, inside this container's browser and through its own proxy.
#
# A CLONE of docker-compose.homelab-ne.yml. Only the per-worker fields differ:
#   container_name  rs-monitor-wc
#   config mount    configs/homelab-wc.toml
#   session dir     configs/sessions/homelab-wc
#   diskcache vol   aimm-home-wc
#   RS_WORKER_ID    wc-1  (in configs/secrets.homelab-wc.env)
#   VNC             5911 on the host
# and the console (docker-compose.console.yml) lists it in RS_WORKER_CONFIGS
# and RS_VNC_TARGETS.
#
# Before first start, on the VM:
#   configs/sessions/homelab-wc/fb_state.json  — an EMPTY storage state,
#       {"cookies": [], "origins": []}. Without any session file the monitor
#       cannot record that it is parked and searches logged out (debug note
#       docs/debug-notes/2026-10-17-new-worker-without-session-file-searches-logged-out.md).
#   configs/secrets.env              — PROXY_HOMELAB_WC=http://isp.decodo.com:10009
#   configs/secrets.homelab-wc.env  — RS_WORKER_ID=wc-1 and its own
#       RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker wc-1)
#
#   docker compose -f deploy/docker-compose.homelab-wc.yml up -d
services:
  monitor-wc:
    image: aimm-recycle:latest
    container_name: rs-monitor-wc
    restart: unless-stopped
    # SIGTERM saves the live Facebook session; supervisord allows it 25 s.
    stop_grace_period: 30s

    # Own VNC port. Loopback-only, same as the others.
    #   ssh -L 5911:127.0.0.1:5911 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5911:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-wc.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-wc.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-wc:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-wc:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-wc:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
