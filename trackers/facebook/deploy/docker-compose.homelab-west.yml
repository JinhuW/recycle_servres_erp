# Second standalone monitor on the homelab VM — the West account (west-1).
#
# One VM, two Facebook accounts, ZERO shared IP: this worker searches only the
# West (configs/homelab-west.toml) and reaches Facebook through its OWN
# dedicated Decodo ISP exit (PROXY_HOMELAB_WEST, port 10004), while rs-monitor
# uses PROXY_HOMELAB (10001). Facebook therefore sees two different residential
# IPs, which is the whole point — accounts kept dying when they shared the
# house IP (see the 2026-08-26 double revocation).
#
# It is a CLONE of docker-compose.homelab.yml. Only the per-worker fields
# differ, and they are the only reason this is a separate file:
#   container_name  rs-monitor-west        (distinct from rs-monitor)
#   config mount    configs/homelab-west.toml  (West: OR/WA, not the SE phase-1 list)
#   session dir     configs/sessions/homelab-west  (its own account's cookies)
#   diskcache vol   aimm-home-west         (its own dedupe/verdict cache)
#   RS_WORKER_ID    west-1                 (own OpenSearch label + control-plane id)
#   VNC             5903 on the host     (5900 is rs-monitor's)
#
# Alerts still go straight to Telegram (same chat, same topics) — the two
# workers cover disjoint regions, so there is nothing to de-duplicate and no
# need to route through the coordinator.
#
# Before first start:
#   configs/sessions/homelab-west/fb_state.json   — the West account's session,
#       CAPTURED THROUGH PROXY_HOMELAB_WEST (10004) so it is born on that IP:
#         rs-session capture --proxy "$PROXY_HOMELAB_WEST" \
#             --storage-state configs/sessions/homelab-west/fb_state.json
#   configs/secrets.homelab-west.env              — RS_WORKER_ID + the worker's
#       own RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker west-1)
#
#   docker compose -f deploy/docker-compose.homelab-west.yml up -d

services:
  monitor-west:
    image: aimm-recycle:latest
    container_name: rs-monitor-west
    restart: unless-stopped

    # Own VNC port; 5900 belongs to rs-monitor. Loopback-only, same as the other.
    #   ssh -L 5901:127.0.0.1:5901 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5903:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-west.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-west.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-west:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-west:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-west:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
