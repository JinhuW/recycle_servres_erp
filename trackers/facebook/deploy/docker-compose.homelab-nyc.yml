# A worker added beside the six regional ones — nyc-1, on the Decodo exit in
# Brooklyn, NY (PROXY_HOMELAB_NYC, port 10007).
#
# Every master.toml region already has a worker, so this one gets cities of
# its own on the ERP's worker page (Edit cities); configs/homelab-nyc.toml
# only seeds the city at its exit. Its Facebook account comes from the ERP's
# account pool: assigning it writes the login into this worker's vault account
# and queues Re-login, which signs in inside this container's browser, through
# its own proxy, so the session is born on the IP it keeps.
#
# Order: start it, set its cities, then give it an account. Until it has a
# login it parks on Facebook's login page and searches nothing, so the seed
# city (which another worker also searches) is never searched twice.
#
# A CLONE of docker-compose.homelab-ne.yml. Only the per-worker fields differ:
#   container_name  rs-monitor-nyc
#   config mount    configs/homelab-nyc.toml
#   session dir     configs/sessions/homelab-nyc
#   diskcache vol   aimm-home-nyc
#   RS_WORKER_ID    nyc-1  (in configs/secrets.homelab-nyc.env)
#   VNC             5907 on the host
# and the console (docker-compose.console.yml) lists it in RS_WORKER_CONFIGS
# and RS_VNC_TARGETS.
#
# Before first start, on the VM:
#   configs/secrets.env               — PROXY_HOMELAB_NYC=http://isp.decodo.com:10007
#   configs/secrets.homelab-nyc.env  — RS_WORKER_ID=nyc-1 and its own
#       RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker nyc-1)
#
#   docker compose -f deploy/docker-compose.homelab-nyc.yml up -d

services:
  monitor-nyc:
    image: aimm-recycle:latest
    container_name: rs-monitor-nyc
    restart: unless-stopped

    # Own VNC port. Loopback-only, same as the others.
    #   ssh -L 5907:127.0.0.1:5907 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5907:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-nyc.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-nyc.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-nyc:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-nyc:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-nyc:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
