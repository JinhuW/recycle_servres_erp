# ca-2b, the second account on ca-2's Decodo exit in Palo Alto, CA
# (PROXY_HOMELAB_CA2, port 10015). The IP is shared ON PURPOSE: a pilot of two
# accounts per IP, with ca-3 and ca-4 as the one-account control. The rules
# are in deploy/README.md → Scaling notes: partners never search the same
# cities, and their first logins are a day or more apart.
#
# It keeps the two accounts looking like two people, not one operator:
#   - its own device profile (README → Device identity);
#   - its own sweep time, 17:00 UTC against ca-2's 13:00. Set it once
#     after the first start:
#       docker exec rs-console python -m rs_console.settings start-at ca-2b 17:00
#     A fleet-wide sweep time saved from the ERP does not override it.
#
# Its cities are its own, set on the ERP's worker page (Edit cities);
# configs/homelab-ca2b.toml only seeds Las Vegas, NV, which ca-2 does not
# search. Its Facebook account comes from the ERP's account pool, like any
# worker's.
#
# Order: start it, set its cities, then give it an account. Until it has a
# login it parks on Facebook's login page and searches nothing.
#
# A CLONE of docker-compose.homelab-ne.yml. Only the per-worker fields differ:
#   container_name  rs-monitor-ca2b
#   config mount    configs/homelab-ca2b.toml
#   session dir     configs/sessions/homelab-ca2b
#   diskcache vol   aimm-home-ca2b
#   RS_WORKER_ID    ca-2b  (in configs/secrets.homelab-ca2b.env)
#   VNC             5923 on the host
# and the console (docker-compose.console.yml) lists it in RS_WORKER_CONFIGS
# and RS_VNC_TARGETS.
#
# Before first start, on the VM:
#   configs/sessions/homelab-ca2b/fb_state.json  — an EMPTY storage state,
#       {"cookies": [], "origins": []}. Without any session file the monitor
#       cannot record that it is parked and searches logged out (debug note
#       docs/debug-notes/2026-10-17-new-worker-without-session-file-searches-logged-out.md).
#   configs/secrets.env              — PROXY_HOMELAB_CA2 is ca-2's; nothing to add
#   configs/secrets.homelab-ca2b.env  — RS_WORKER_ID=ca-2b and its own
#       RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker ca-2b)
#   the vault slot, so its device reports Pacific time:
#       rsc vault set-account --account-id ca-2b --worker ca-2b --region rs_west #           --no-prompt
#
#   docker compose -f deploy/docker-compose.homelab-ca2b.yml up -d
services:
  monitor-ca2b:
    image: aimm-recycle:latest
    container_name: rs-monitor-ca2b
    restart: unless-stopped
    # SIGTERM saves the live Facebook session; supervisord allows it 25 s.
    stop_grace_period: 30s

    # Own VNC port. Loopback-only, same as the others.
    #   ssh -L 5923:127.0.0.1:5923 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5923:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-ca2b.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-ca2b.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-ca2b:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-ca2b:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-ca2b:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
