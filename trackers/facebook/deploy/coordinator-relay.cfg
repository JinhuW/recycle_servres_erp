global
    log stdout format raw local0
    maxconn 128
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver docker 127.0.0.11:53
    hold valid 10s

frontend coordinator_ingress
    bind :8500
    # Local Docker clients reach the LAN publish through this bridge gateway.
    acl worker_source src 10.10.60.14/32 172.24.0.1/32
    tcp-request connection reject unless worker_source
    default_backend coordinator

backend coordinator
    server coordinator rs-coordinator:8500 check resolvers docker init-addr libc,none
