# bos-1b, the second account on bos-1's Decodo exit in Boston, MA
# (PROXY_HOMELAB_BOS, port 10011).
#
# Every IP carries two workers. What keeps two accounts on one IP looking
# like two people, not one operator, is in deploy/README.md → Scaling notes.
# This worker has:
#   - its own device profile (README → Device identity);
#   - its own sweep time, 17:00 UTC against bos-1's 13:00. Set it once
#     after the first start:
#       docker exec rs-console python -m rs_console.settings start-at bos-1b 17:00
#     A fleet-wide sweep time saved from the ERP does not override it;
#   - its own cities, set on the ERP's worker page (Edit cities), never ones
#     bos-1 searches. configs/homelab-bos1b.toml only seeds Worcester, MA.
#
# Its Facebook account comes from the ERP's account pool, like any worker's,
# a day or more after bos-1's first login. Until it has one it parks on
# Facebook's login page and searches nothing.
#
# A CLONE of docker-compose.homelab-ne.yml. Only the per-worker fields differ:
#   container_name  rs-monitor-bos1b
#   config mount    configs/homelab-bos1b.toml
#   session dir     configs/sessions/homelab-bos1b
#   diskcache vol   aimm-home-bos1b
#   RS_WORKER_ID    bos-1b  (in configs/secrets.homelab-bos1b.env)
#   VNC             5934 on the host
# and the console (docker-compose.console.yml) lists it in RS_WORKER_CONFIGS
# and RS_VNC_TARGETS.
#
# Before first start, on the VM:
#   configs/sessions/homelab-bos1b/fb_state.json  — an EMPTY storage state,
#       {"cookies": [], "origins": []}. Without any session file the monitor
#       cannot record that it is parked and searches logged out (debug note
#       docs/debug-notes/2026-10-17-new-worker-without-session-file-searches-logged-out.md).
#   configs/secrets.env              — PROXY_HOMELAB_BOS is bos-1's; nothing to add
#   configs/secrets.homelab-bos1b.env  — RS_WORKER_ID=bos-1b and its own
#       RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker bos-1b)
#   (no vault slot needed: the device defaults to Eastern time, which
#   matches this exit)
#
#   docker compose -f deploy/docker-compose.homelab-bos1b.yml up -d
services:
  monitor-bos1b:
    image: aimm-recycle:latest
    container_name: rs-monitor-bos1b
    restart: unless-stopped
    # SIGTERM saves the live Facebook session; supervisord allows it 25 s.
    stop_grace_period: 30s

    # Own VNC port. Loopback-only, same as the others.
    #   ssh -L 5934:127.0.0.1:5934 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5934:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-bos1b.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-bos1b.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-bos1b:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-bos1b:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-bos1b:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
