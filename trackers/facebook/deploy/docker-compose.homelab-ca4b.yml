# ca-4b, the second account on ca-4's Decodo exit in Palo Alto, CA
# (PROXY_HOMELAB_CA4, port 10017).
#
# Every IP carries two workers. What keeps two accounts on one IP looking
# like two people, not one operator, is in deploy/README.md → Scaling notes.
# This worker has:
#   - its own device profile (README → Device identity), on Pacific time:
#     its vault slot is in region rs_west;
#   - its own sweep time, 17:00 UTC against ca-4's 13:00. Set it once
#     after the first start:
#       docker exec rs-console python -m rs_console.settings start-at ca-4b 17:00
#     A fleet-wide sweep time saved from the ERP does not override it;
#   - its own cities, set on the ERP's worker page (Edit cities), never ones
#     ca-4 searches. configs/homelab-ca4b.toml only seeds Las Vegas, NV.
#
# Its Facebook account comes from the ERP's account pool, like any worker's,
# a day or more after ca-4's first login. Until it has one it parks on
# Facebook's login page and searches nothing.
#
# A CLONE of docker-compose.homelab-ne.yml. Only the per-worker fields differ:
#   container_name  rs-monitor-ca4b
#   config mount    configs/homelab-ca4b.toml
#   session dir     configs/sessions/homelab-ca4b
#   diskcache vol   aimm-home-ca4b
#   RS_WORKER_ID    ca-4b  (in configs/secrets.homelab-ca4b.env)
#   VNC             5938 on the host
# and the console (docker-compose.console.yml) lists it in RS_WORKER_CONFIGS
# and RS_VNC_TARGETS.
#
# Before first start, on the VM:
#   configs/sessions/homelab-ca4b/fb_state.json  — an EMPTY storage state,
#       {"cookies": [], "origins": []}. Without any session file the monitor
#       cannot record that it is parked and searches logged out (debug note
#       docs/debug-notes/2026-10-17-new-worker-without-session-file-searches-logged-out.md).
#   configs/secrets.env              — PROXY_HOMELAB_CA4 is ca-4's; nothing to add
#   configs/secrets.homelab-ca4b.env  — RS_WORKER_ID=ca-4b and its own
#       RS_CONTROL_PLANE_TOKEN (rsc mint-token --worker ca-4b)
#   the vault slot, so its device reports Pacific time:
#       rsc vault set-account --account-id ca-4b --worker ca-4b --region rs_west \
#           --no-prompt
#
#   docker compose -f deploy/docker-compose.homelab-ca4b.yml up -d
services:
  monitor-ca4b:
    image: aimm-recycle:latest
    container_name: rs-monitor-ca4b
    restart: unless-stopped
    # SIGTERM saves the live Facebook session; supervisord allows it 25 s.
    stop_grace_period: 30s

    # Own VNC port. Loopback-only, same as the others.
    #   ssh -L 5938:127.0.0.1:5938 jinhu@10.10.10.73
    ports:
      - "127.0.0.1:5938:5900"

    # Shared secrets first, then this worker's overrides (later file wins):
    # RS_WORKER_ID and its own RS_CONTROL_PLANE_TOKEN live in the second file so
    # they do not collide with rs-monitor's identity in the shared one.
    env_file:
      - ../configs/secrets.env
      - ../configs/secrets.homelab-ca4b.env

    environment:
      AIMM_ENABLE_VNC: "1"
      AIMM_WEBUI_HOST: 127.0.0.1
      AIMM_WEBUI_PORT: "8467"
      AIMM_OPENSEARCH_URL: "http://host.docker.internal:9200"
      AIMM_OPENSEARCH_INDEX: "fb-tracker"

    volumes:
      - ../configs/homelab-ca4b.toml:/root/.ai-marketplace-monitor/config.toml:ro
      - aimm-home-ca4b:/root/.ai-marketplace-monitor
      - ../configs/sessions/homelab-ca4b:/data
      - ./healthcheck.sh:/usr/local/bin/rs-healthcheck:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/rs-healthcheck"]
      interval: 5m
      timeout: 1m
      retries: 1
      start_period: 10m

    shm_size: 1gb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - rs-fleet

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  aimm-home-ca4b:

networks:
  rs-fleet:
    name: rs-fleet
    external: true
