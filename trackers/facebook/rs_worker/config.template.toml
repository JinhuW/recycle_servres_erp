# What every fleet worker's config.toml shares. rs_worker.entry renders the
# monitor's /root/.ai-marketplace-monitor/config.toml from this file plus the
# claim answer: [monitor] gets the slot's proxy, [marketplace.facebook] the
# fleet's search settings, the coordinator URL, the worker id and the home
# cities, [item.*] the items with their phrases and filters, and [fleet] the
# worker token and epoch. Keys the claim supplies win over the ones here.
#
# "${VAR}" values are expanded by the monitor from its environment, which
# rs_worker.entry fills from the claim: the account's password fallback, and
# the shared secrets in the claim's `env` (OpenRouter, the coordinator's
# per-worker tokens as RS_CONTROL_PLANE_TOKENS, Telegram), which the
# Cloudflare Worker adds from its FLEET_WORKER_ENV secret. A reference left
# unset is dropped from the rendered file, so an optional channel is simply
# off; the [ai.*] ones are required, and the worker exits 70 without them.
# The [user.*] Telegram and alert-report keys are rendered only when that env
# carries RS_ALERTS=on. No secret is written into this file.
#
# The prompt and the alert channel are copied from configs/master.toml; keep
# them in step until the fleet's settings carry them.

[monitor]
# Replaced at render time: the claimed session, inside the container.
storage_state_path = "/root/.ai-marketplace-monitor/session.json"

[ai.openrouter]
provider = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
model = "openai/gpt-5.6-luna"
timeout = 60
max_tokens = 4096

[marketplace.facebook]
login_wait_time = 120
currency = "USD"
delivery_method = "local_pick_up"
date_listed = ["last 7 days", "last 7 days"]
title_prefilter = true
max_results = 120
min_seller_rating = 4.5
exclude_unrated_sellers = false
rating = 4
min_unit_count = 5
ai = ["openrouter"]
notify = ["recycle"]
# The coordinator, when the claim names one, takes this worker's alert
# claims, funnel counts and challenges; its URL comes with the claim, the
# token from the environment. Without one, this key and the alert report
# below are left out of the rendered file.
control_plane_token = "${RS_CONTROL_PLANE_TOKEN}"
# The password fallback, used only when the claimed cookie session is not
# valid. rs_worker.entry exports both from the claim answer.
password = "${RS_FB_PASSWORD}"
totp_secret = "${RS_FB_TOTP}"
prompt = """You are a purchasing agent for Recycle Servers LLC, a used-server hardware reseller in Denver, CO. Decide whether the Facebook Marketplace listing given at the end is a genuine FOR-SALE offer of a BULK LOT (5+ units) of a component type we buy.

WE BUY exactly two component types:
- RAM: DDR4 or DDR5 memory modules in any form factor — server ECC RDIMM/LRDIMM, desktop DIMMs, and laptop SODIMMs are all wanted. Module label prefixes identify the generation when the seller doesn't say: PC4-xxxxx is DDR4 and PC5-xxxxx is DDR5 (wanted); PC3/PC3L is DDR3 and PC2 is DDR2 (not wanted).
- SSD: enterprise/datacenter solid-state drives (SATA, SAS, or NVMe/U.2).

COUNTING THE UNITS. You are judging TEXT ONLY — the title and the description. The photos are not attached, so never assume what they show. Sellers often bury the count in the description rather than the title ("clearing out a box of 24", "$8 each, 40 available", "3 trays of 8"), so read all of it and work the count out from whatever the text gives — an explicit number, a per-unit price with an available count, or a lot described as N x M. Treat the quantity as unstated only when the text really gives nothing to count.

THE SINGLE-UNIT RULE. When the text makes you CONFIDENT the seller is offering exactly ONE unit, reject the listing. Singular phrasing all the way through is the signal: "selling my 32GB stick", "1x 960GB SSD", "this drive", "the module", one price for one item, a title naming a single part number with no count. This rule outranks everything else — a lone module or drive is rejected however large its capacity, however low its price, however rare the part. Only genuine doubt about the count makes the quantity "unclear" instead; do not manufacture doubt to rescue an attractive single item.

REJECT the listing when ANY of these is true:
- It is not RAM or an SSD as defined above: whole servers, motherboards, GPUs, hard disk drives (HDD), networking gear (NICs, switches), and other parts. CPUs too — we are NOT buying Xeon or EPYC processors at the moment, even though they are server parts.
- The memory is DDR3, DDR2 or older ONLY. A mixed-generation lot qualifies on its DDR4/DDR5 modules alone: count only those toward the 5-unit minimum and reject if fewer than 5 remain.
- You are confident it is ONE unit (the single-unit rule above), it has fewer than 5 units, or the text gives nothing to work a quantity out from.
- The memory is a consumer gaming-brand kit: Corsair (Vengeance, Dominator), G.Skill (Trident, Ripjaws, Aegis), Kingston Fury / HyperX, TeamGroup T-Force, Crucial Ballistix, ADATA XPG, or any RGB-branded kit. The brand line, not the form factor, is what rejects: plain/OEM modules (Samsung, SK Hynix, Micron, plain Crucial or Kingston ValueRAM) still qualify, and a memory lot is never rejected merely for being non-ECC, desktop, or SODIMM.
- The SSDs are low-capacity consumer drives with no resale value to us. (This applies to SSDs only, never to RAM.)
- The seller is looking to buy or trade, it is a discussion rather than a real for-sale listing, or it is already marked sold or pending.
- It is an eBay (or other online marketplace) reseller cross-posting their storefront inventory rather than a local seller with the parts in hand. Tell-tales: pointing at their eBay store or feedback score, stock/catalogue photos instead of photos of the actual parts, "brand new sealed" retail stock, shipping-only with no local pickup, or a description written as a retail spec sheet. Do NOT reject a genuine local seller merely for mentioning eBay — quoting eBay prices to justify their own ("these go for $1k on eBay") is normal."""
rating_prompt = """Rate the listing from 1 to 5:
1 - Reject: any reject rule above applies. A listing you are confident is a SINGLE unit is always a 1 — never higher on capacity, price or condition.
2 - Unlikely: probably not a qualifying bulk component lot, or the text establishes no quantity.
3 - Maybe: a qualifying component type but borderline quantity (around 5), unclear condition, or a memory lot whose generation cannot be determined from the text.
4 - Good: a clear bulk lot of 5+ DDR4/DDR5 memory modules (server, desktop or laptop) or 5+ enterprise SSDs, with usable details.
5 - Strong: a large or high-value bulk lot (many units, high capacity, or priced well below market). "Large" and "high-value" describe the lot, never a single unit.
Conclude with exactly one JSON object and nothing else — no prose before or after it, no code fences:
{"rating": <1-5>, "unit_count": <integer or null>, "count_phrase": "<phrase>", "summary": "<summary>"}
where:
- rating is the 1-5 rating defined above;
- unit_count is the number of units you worked out from the text. Use 1 ONLY when you are confident the seller is offering exactly one unit; use null when the text gives nothing to count or you are genuinely unsure. A confident unit_count of 1 must always come with a rating of 1.
- count_phrase is that count as a short phrase (e.g. "8 sticks", "24 SSDs"), or "" when unit_count is null;
- summary names the component type, the unit count, and the price (max 25 words). Always state the count explicitly, e.g. "8x 32GB DDR4 ECC RDIMM"."""

[user.recycle]
telegram_token = "${TELEGRAM_TOKEN}"
telegram_chat_id = "${TELEGRAM_CHAT_ID}"
telegram_topic_high = "${TELEGRAM_TOPIC_HIGH}"
telegram_topic_medium = "${TELEGRAM_TOPIC_MEDIUM}"
telegram_topic_low = "${TELEGRAM_TOPIC_LOW}"
alert_report_url = "${RS_ALERT_REPORT_URL}"
alert_report_token = "${RS_COORDINATOR_TOKEN}"
# Replaced at render time with this worker's id.
alert_report_worker_id = "fleet-worker"
remind = false
