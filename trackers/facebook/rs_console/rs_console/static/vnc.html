<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch · Facebook tracker · Recycle Servers</title>
  <link rel="icon" href="/static/recycle-servers-icon.png">
  <link rel="stylesheet" href="/static/fleet.css?v=__ASSET_V__">
</head>
<body class="vnc-body">
  <header class="topbar">
    <div class="brand">
      <a class="brand-mark" href="/" title="Back to the fleet">RS</a>
      <div>
        <div class="brand-name">Recycle Servers</div>
        <div class="brand-sub">Facebook tracker · <span class="mono" id="worker">worker</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="vnc-status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
      <label class="vnc-toggle" title="Off: watch only. On: your mouse and keyboard go to the worker's browser — the same one the scraper is driving.">
        <input type="checkbox" id="control">
        <span>Take control</span>
      </label>
      <button class="btn sm" id="relogin" type="button"
              title="Make this worker re-run its Facebook login — username, password and 2FA code are filled in automatically. Use when the session is stuck or expired.">Re-login</button>
      <button class="btn sm" id="reconnect" type="button" hidden>Reconnect</button>
      <a class="btn sm ghost" href="/">Fleet</a>
    </div>
  </header>

  <main class="vnc-stage" id="stage">
    <div class="vnc-screen" id="screen"></div>
    <div class="vnc-overlay" id="overlay" hidden>
      <div class="vnc-overlay-card">
        <h2 id="overlay-title">Connecting</h2>
        <p id="overlay-text"></p>
        <div class="modal-actions" id="overlay-actions"></div>
      </div>
    </div>
  </main>

  <p class="vnc-note" id="note">
    This is the live Chromium the worker is driving, shared with the scraper. Watching is safe.
    Take control only to clear a checkpoint, and hand it back when you are done.
  </p>

  <script type="module" src="/static/vnc.js?v=__ASSET_V__"></script>
</body>
</html>
