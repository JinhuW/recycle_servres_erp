[project]
name = "rs-console"
version = "0.14.4"
description = "Read-mostly console facade for the Recycle Servers fleet coordinator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # uvicorn speaks WebSocket only with a protocol library installed; the
    # VNC bridge (/v1/vnc/<worker>/ws) needs one.
    "websockets>=12",
    # Writes saved settings into the worker configs without losing their
    # comments, which are most of master.toml.
    "tomlkit>=0.12",
    # Each worker's day is bucketed in its region's zone; slim images may
    # ship without the system zoneinfo database.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rs_console*"]

# The dashboard shell and its assets ship inside the package so the image
# needs nothing but `pip install .`. static/novnc is the vendored noVNC
# client (see static/novnc/VERSION); pako sits five levels down.
[tool.setuptools.package-data]
rs_console = [
    "static/*",
    "static/fonts/*",
    "static/novnc/*",
    "static/novnc/*/*",
    "static/novnc/*/*/*",
    "static/novnc/*/*/*/*",
    "static/novnc/*/*/*/*/*",
]
