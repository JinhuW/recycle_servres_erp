[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-coordinator"
version = "0.13.5"
description = "Central coordinator for the Recycle Servers Facebook Marketplace worker fleet"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "tomli-w>=1.0",
  # Fernet, for the account secret vault
  "cryptography>=42",
  # RFC 6238 codes, minted from the vault's TOTP secrets
  "pyotp>=2.9",
  # Postgres backend (rs_coordinator/pg.py). Imported lazily, so SQLite-only
  # deployments never touch it — but it ships by default because the hosted
  # control plane runs on Railway Postgres.
  "psycopg[binary]>=3.1",
  "psycopg_pool>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
rsc = "rs_coordinator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rs_coordinator"]
