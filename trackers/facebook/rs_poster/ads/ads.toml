cities = ["Denver, CO"]
groups = []

[ad.datacenter_cleanout]
title = "Datacenter and Office IT Cleanout - We Remove and Pay for Your Old Servers"
price = 123
category = "Electronics"
condition = "Used - Good"
photo_set = "datacenter_cleanout"
renew_days = 10
description = """Decommissioning a server room or closing an office? Recycle Servers LLC
(Denver, CO) buys the hardware and hauls it out. The listed price is a placeholder.

We handle full-rack decommissions, pallet lots, and mixed IT equipment. We bring the
