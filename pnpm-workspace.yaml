packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# uuid@8 (via exceljs) carries GHSA-w5hq-g745-h8pq; exceljs only calls v4(),
# which is API-compatible across the bump.
overrides:
  "exceljs>uuid": "^11.1.1"
  # exceljs → archiver → glob/minimatch pin brace-expansion 1.x and 2.x below
  # their ReDoS fixes. Nothing in that chain sees user input; the lockfile is
  # what the audit reads.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
